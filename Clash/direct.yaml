# 学术出版 / 科研资源 直连规则集
# 格式：classical（每行带类型前缀）
#   DOMAIN,xxx = 精确匹配；DOMAIN-SUFFIX,xxx = 后缀匹配（含所有子域名）
# ⚠️ 脚本里 behavior 必须写 "classical"
# 用途：FlClash / mihomo rule-provider  →  RULE-SET,direct-academic,DIRECT
payload:

  # ── 后缀匹配（35 条）────────────────────────────
  # ACS
  - 'DOMAIN-SUFFIX,acs.org'
  # Wiley
  - 'DOMAIN-SUFFIX,wiley.com'
  - 'DOMAIN,wiley.scienceconnect.io'
  # Elsevier / ScienceDirect
  - 'DOMAIN-SUFFIX,elsevier.com'
  - 'DOMAIN-SUFFIX,sciencedirect.com'
  - 'DOMAIN-SUFFIX,sciencedirectassets.com'
  - 'DOMAIN-SUFFIX,els-cdn.com'
  # RSC
  - 'DOMAIN-SUFFIX,rsc.org'
  # Nature / Springer Nature
  - 'DOMAIN-SUFFIX,nature.com'
  - 'DOMAIN-SUFFIX,springernature.com'
  - 'DOMAIN-SUFFIX,readcube.com'
  # AAAS Science
  - 'DOMAIN-SUFFIX,science.org'
  # Springer
  - 'DOMAIN-SUFFIX,springer.com'
  # Reaxys / CAS
  - 'DOMAIN-SUFFIX,reaxys.com'
  - 'DOMAIN-SUFFIX,cas.org'
  # Optica
  - 'DOMAIN-SUFFIX,optica.org'
  # Taylor & Francis
  - 'DOMAIN-SUFFIX,tandfonline.com'
  # scite
  - 'DOMAIN-SUFFIX,scite.ai'
  # Altmetric
  - 'DOMAIN-SUFFIX,altmetric.com'
  # 第三方服务
  - 'DOMAIN-SUFFIX,osano.com'
  - 'DOMAIN-SUFFIX,addtoany.com'
  - 'DOMAIN-SUFFIX,semetricmedia.com'
  # OUP
  - 'DOMAIN-SUFFIX,oup.com'
  # 其他出版社
  - 'DOMAIN-SUFFIX,jthjournal.org'
  - 'DOMAIN-SUFFIX,proquest.com'
  - 'DOMAIN-SUFFIX,apa.org'
  - 'DOMAIN-SUFFIX,worldscientific.com'
  - 'DOMAIN-SUFFIX,ametsoc.org'
  - 'DOMAIN-SUFFIX,magonlinelibrary.com'
  - 'DOMAIN-SUFFIX,perfdrive.com'
  - 'DOMAIN-SUFFIX,crossref.org'
  - 'DOMAIN-SUFFIX,thieme-connect.de'
  # IOP
  - 'DOMAIN-SUFFIX,iop.org'
  - 'DOMAIN-SUFFIX,utppublishing.com'
  # 智慧树
  - 'DOMAIN-SUFFIX,hybbtree.com'

  # ── 精确匹配（18 条）────────────────────────────
  # OUP / SPIE / Hogrefe / 出版社子站
  - 'DOMAIN,academic.oup.com'
  - 'DOMAIN,oup.silverchair-cdn.com'
  - 'DOMAIN,oup2-idp.sams-sigma.com'
  - 'DOMAIN,www.spiedigitallibrary.org'
  - 'DOMAIN,spie.org'
  - 'DOMAIN,econtent.hogrefe.com'
  - 'DOMAIN,www.concrete.org'
  # Crossref（Crossmark 相关）
  - 'DOMAIN,crossmark.crossref.org'
  - 'DOMAIN,crossmark-cdn.crossref.org'
  # IOP / SeamlessAccess
  - 'DOMAIN,static.iopscience.com'
  - 'DOMAIN,cdp.iopscience.iop.org'
  - 'DOMAIN,service.seamlessaccess.org'
  # 其他
  - 'DOMAIN,cdn.pendo.io'
  - 'DOMAIN,wiley-jobs-widget.madgexjb.com'
  - 'DOMAIN,videofile.hybbtree.com'
  - 'DOMAIN,rscj.silverchair-cdn.com'
  - 'DOMAIN,assets.aaas.org'
  - 'DOMAIN,acs.silverchair-cdn.com'
  # 注：utppublishing.com 已用后缀覆盖，此处不再重复
