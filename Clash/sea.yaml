# ══════════════════════════════════════════════════════════════
#  指定节点分流规则集 · 东南亚专线（Polymarket / Hyperliquid / PolyEase / predict.fun / trade.xyz）
#
#  格式：classical（与 adblock/direct 的 domain 格式不同）
#    DOMAIN-SUFFIX,polymarket.com
#    DOMAIN,clob.polymarket.com
#
#  ⚠️ 脚本里 behavior 必须写 "classical"
#
#  更新后清缓存：
#    https://raw.githubusercontent.com/ephore/Broker-Rule/main/Clash/sea.yaml
#
#  内容：
#    · Polymarket  —— 44 条（kr.yaml 已于 2026-11 清空，规则只保留在本文件）
#    · Hyperliquid —— 20 条（永续 DEX：API/WS/RPC/桥/钱包登录依赖）
#    · PolyEase    ——  2 条（第三方图表站，行情直连 Hyperliquid 官方域名）
#    · predict.fun ——  6 条（BNB 链预测市场：GraphQL / WS / 静态资源 / 登录）
#    · trade[XYZ]  ——  3 条（美股/IPO 永续，行情直连 Hyperliquid）
#  挂载：RULE-SET,my-sea → 🌏 东南亚专线
# ══════════════════════════════════════════════════════════════
payload:

  # ── 主站与主 API（clob 下单 / gamma 行情 / data-api 持仓 / relayer 免 gas）（7 条）
  - 'DOMAIN-SUFFIX,polymarket.com'
  - 'DOMAIN-SUFFIX,polymarket.us'
  - 'DOMAIN-SUFFIX,polymarket.dev'
  - 'DOMAIN,clob.polymarket.com'
  - 'DOMAIN,gamma-api.polymarket.com'
  - 'DOMAIN,data-api.polymarket.com'
  - 'DOMAIN,combos-rfq-api.polymarket.sh'

  # ── 实时推送 WebSocket（订单簿 / 成交 / 链上活动）（5 条）
  - 'DOMAIN,ws-subscriptions-clob.polymarket.com'
  - 'DOMAIN,ws-subscriptions-frontend-clob.polymarket.com'
  - 'DOMAIN,ws-live-data.polymarket.com'
  - 'DOMAIN,ws-live-v2.polymarket.com'
  - 'DOMAIN,ws.perpetuals.polymarket.com'

  # ── 交易 / 结算基础设施（relayer 免 gas、跨链充值、地区风控、RFQ）（6 条）
  - 'DOMAIN,relayer-v2.polymarket.com'
  - 'DOMAIN,bridge.polymarket.com'
  - 'DOMAIN,geo-ip-api.polymarket.com'
  - 'DOMAIN,combos-rfq-api.polymarket.com'
  - 'DOMAIN,combos-rfq-gateway-frontend.polymarket.com'
  - 'DOMAIN,api.polymarket.us'

  # ── 体育 / 永续 / DeFi 子产品（6 条）
  - 'DOMAIN,sports-api.polymarket.com'
  - 'DOMAIN,api.perpetuals.polymarket.com'
  - 'DOMAIN,assets.perpetuals.polymarket.com'
  - 'DOMAIN,api.defi.polymarket.com'
  - 'DOMAIN,institutional.polymarket.com'
  - 'DOMAIN,mm.clob.polymarket.com'

  # ── 静态资源 / 地图瓦片 / 行情小部件（5 条）
  - 'DOMAIN,tiles.polymarket.com'
  - 'DOMAIN,images.polymarket.com'
  - 'DOMAIN,banners.polymarket.com'
  - 'DOMAIN,ticker.polymarket.com'
  - 'DOMAIN,embeds.polymarket.com'

  # ── 图片 / 行情 S3（1 条）
  - 'DOMAIN-SUFFIX,polymarket-upload.s3.us-east-2.amazonaws.com'

  # ── 第三方依赖：钱包登录 / 链上 RPC / 行情与支付 SDK（9 条）
  - 'DOMAIN-SUFFIX,magic.link'
  - 'DOMAIN,polygon-mainnet.g.alchemy.com'
  - 'DOMAIN,eth-mainnet.g.alchemy.com'
  - 'DOMAIN,data.ornn.com'
  - 'DOMAIN,api.sunbreak.com'
  - 'DOMAIN-SUFFIX,fun.xyz'
  - 'DOMAIN,igove4ofv.platform.grcv.io'
  - 'DOMAIN,sdk.iad-07.braze.com'
  - 'DOMAIN,sr-client-cfg.amplitude.com'

  # ── 帮助 / 文档 / 状态页（5 条）
  - 'DOMAIN-SUFFIX,polymarket.mintlify.app'
  - 'DOMAIN,help.polymarket.com'
  - 'DOMAIN,docs.polymarket.com'
  - 'DOMAIN,status.polymarket.com'
  - 'DOMAIN,news.polymarket.com'

  # ══════════════════════════════════════════════════════════════
  #  Hyperliquid（永续合约 DEX）—— 共 20 条
  #  来源核查（2026-11）：
  #    · 官方文档 hyperliquid.gitbook.io（150 页全量，API/WS/RPC 端点）
  #    · app.hyperliquid.xyz 前端实际请求（api-ui / privy / walletconnect）
  #    · Cloudflare DoH 逐条验证可解析（testnet 已剔除）
  # ══════════════════════════════════════════════════════════════
  # ── 主站 / 交易所前端（3 条）
  - 'DOMAIN-SUFFIX,hyperliquid.xyz'
  - 'DOMAIN,app.hyperliquid.xyz'
  - 'DOMAIN,api-ui.hyperliquid.xyz'

  # ── 核心 API + WebSocket（下单 /info /exchange /ws 实时推送）（2 条）
  - 'DOMAIN,api.hyperliquid.xyz'
  - 'DOMAIN,stats-data.hyperliquid.xyz'

  # ── HyperEVM 链上 RPC（含 docs 中的公共 RPC）（4 条）
  - 'DOMAIN,rpc.hyperliquid.xyz'
  - 'DOMAIN,hyperliquid.drpc.org'
  - 'DOMAIN,hyperliquid-json-rpc.stakely.io'
  - 'DOMAIN,rpc.hypurrscan.io'

  # ── 跨链充值 / Unit 桥（2 条）
  - 'DOMAIN-SUFFIX,hyperunit.xyz'

  # ── 区块浏览器／数据站（3 条）
  - 'DOMAIN-SUFFIX,hyperscan.com'
  - 'DOMAIN-SUFFIX,hyperevmscan.io'
  - 'DOMAIN-SUFFIX,hypurrscan.io'

  # ── 生态门户 / 官方文档（2 条）
  - 'DOMAIN,hl.eco'
  - 'DOMAIN,hyperliquid.gitbook.io'

  # ── 登录与钱包连接（privy / web3modal / walletconnect）（5 条）
  - 'DOMAIN-SUFFIX,privy.io'
  - 'DOMAIN,api.web3modal.org'
  - 'DOMAIN,explorer-api.walletconnect.com'
  - 'DOMAIN,pulse.walletconnect.org'
  - 'DOMAIN,verify.walletconnect.org'

  # ══════════════════════════════════════════════════════════════
  #  PolyEase（第三方 Hyperliquid / Polymarket 图表站）—— 共 2 条
  #  核查（2026-11）：
  #    · 两站均为纯前端，后端走同域 /api/v1、/account/api 相对路径
  #    · chats 站行情直连 api.hyperliquid.xyz + api-ui.hyperliquid.xyz
  #      （主备 WS 亦然），这两条已在本文件 Hyperliquid 段覆盖
  #    · polyease.app 为 Cloudflare 泛解析，v3/docs/status/api 等
  #      子域实测均返回 525（不存在），故只收真实站点
  # ══════════════════════════════════════════════════════════════
  - 'DOMAIN-SUFFIX,polyease.app'
  - 'DOMAIN,chats.polyease.app'

  # ══════════════════════════════════════════════════════════════
  #  predict.fun（BNB Chain 预测市场）—— 共 6 条
  #  核查（2026-11）：
  #    · 75 个 Next.js chunk 全量解析，端点硬编码在配置里：
  #        graphqlEndpoint  https://graphql.predict.fun/graphql
  #        websocketEndpoint wss://ws.predict.fun/ws
  #        staticDomain     static.predict.fun
  #    · 浏览器实测另有 privy.predict.fun（Privy 登录专用 CNAME）
  #    · testnet 的 *.predict.fail 已剔除
  #  ⚠️ 链上行情还直连 rpc.hyperliquid.xyz，该条已在 Hyperliquid 段覆盖
  # ══════════════════════════════════════════════════════════════
  - 'DOMAIN-SUFFIX,predict.fun'
  - 'DOMAIN,graphql.predict.fun'
  - 'DOMAIN,ws.predict.fun'
  - 'DOMAIN,static.predict.fun'
  - 'DOMAIN,privy.predict.fun'
  - 'DOMAIN,developers.predict.fun'

  # ══════════════════════════════════════════════════════════════
  #  trade[XYZ]（Hyperliquid 之上的股票/IPO 永续合约）—— 共 3 条
  #  核查（2026-11）：
  #    · 55 个 Next.js chunk 全量解析 + 浏览器实测
  #    · 行情直连 api.hyperliquid.xyz / api-ui.hyperliquid.xyz，
  #      跨链走 api.hyperunit.xyz，均已在本文件前文覆盖
  #    · 自身登录/后端为同域相对路径（/api/v1/*），无独立 API 子域
  #    · www / api / ws / static / cdn / status / graphql 等子域均无 DNS
  # ══════════════════════════════════════════════════════════════
  - 'DOMAIN-SUFFIX,trade.xyz'
  - 'DOMAIN,app.trade.xyz'
  - 'DOMAIN,docs.trade.xyz'
