#  指定节点分流规则集 · 台湾专线
#
#  格式：domain（payload 是纯域名，不是完整规则行）
#    '+.example.com'    后缀匹配（含所有子域名）
#    'target.example'   精确匹配（只这一条）
#
#  ⚠️ 脚本里 behavior 必须写 "domain"
#
#  启用：脚本里加上 RULE-SET,my-tw,🇨🇳 台湾专线
#  更新后清缓存：
#    https://purge.jsdelivr.net/gh/ephore/Broker-Rule@main/Clash/tw.yaml
